<div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
  <h1 class="h3 mb-0">Yönetici Paneli</h1>
  <div class="d-flex gap-2">
    <a href="{% url 'admin:index' %}" class="btn btn-outline-secondary btn-sm">Soru / Sınıf Yönetimi</a>
    <form method="post" action="{% url 'admin:logout' %}">{% csrf_token %}<button class="btn btn-outline-secondary btn-sm">Çıkış</button></form>
  </div>
</div>
<ul class="nav nav-tabs mt-3">
  <li class="nav-item"><a class="nav-link{% if sekme == 'sonuclar' %} active{% endif %}" href="{% url 'anket:panel' %}">Sonuçlar</a></li>
  <li class="nav-item"><a class="nav-link{% if sekme == 'kodlar' %} active{% endif %}" href="{% url 'anket:kodlar' %}">Veli Kodları</a></li>
</ul>
{% if messages %}
<div class="mt-3">{% for m in messages %}<div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %} py-2 mb-2">{{ m }}</div>{% endfor %}</div>
{% endif %}
