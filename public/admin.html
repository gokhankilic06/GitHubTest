<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yönetici Paneli</title>
  <link rel="stylesheet" href="/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Giriş -->
  <div id="loginView" class="container py-5 d-none" style="max-width:380px">
    <h1 class="h4 mb-3 text-center">Yönetici Girişi</h1>
    <form id="loginForm" class="card card-body shadow-sm">
      <label for="password" class="form-label">Şifre</label>
      <input type="password" id="password" class="form-control mb-3" autocomplete="current-password" required>
      <div id="loginError" class="alert alert-danger py-2 d-none"></div>
      <button class="btn btn-primary w-100">Giriş Yap</button>
    </form>
  </div>

  <!-- Panel -->
  <div id="adminView" class="container-fluid admin-wrap py-3 d-none">
    <div class="d-flex justify-content-between align-items-center">
      <h1 class="h3 mb-0">Yönetici Paneli</h1>
      <div class="d-flex gap-2">
        <a href="/api/admin/export.csv" class="btn btn-outline-success btn-sm">Excel'e Aktar (CSV)</a>
        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">Çıkış</button>
      </div>
    </div>

    <p class="mt-3 mb-2" id="participantCount"></p>
    <div class="table-responsive">
      <table class="table table-bordered table-sm">
        <thead>
          <tr><th style="width:80px">Sıra No</th><th>Ad Soyad</th><th>Sınıf</th><th>Yanıtlar</th><th style="width:60px">İşlem</th></tr>
        </thead>
        <tbody id="responsesBody"></tbody>
      </table>
    </div>
    <div class="text-end">
      <button id="resetBtn" class="btn btn-danger btn-sm">Verileri Sıfırla</button>
    </div>

    <h2>Soru Bazlı Dağılım</h2>
    <div class="table-responsive">
      <table class="table table-bordered table-sm">
        <thead><tr><th>Soru</th><th>A Seçeneği</th><th>B Seçeneği</th></tr></thead>
        <tbody id="distributionBody"></tbody>
      </table>
    </div>

    <h2>Bireysel Yanıt Tablosu</h2>
    <div class="table-responsive">
      <table class="table table-bordered table-sm individual">
        <thead id="individualHead"></thead>
        <tbody id="individualBody"></tbody>
      </table>
    </div>

    <h2>Soruya Göre Filtrelenmiş Sonuçlar</h2>
    <div class="table-responsive">
      <table class="table table-bordered table-sm">
        <thead><tr><th>Şık</th><th style="width:130px">Seçen Sayısı</th><th style="width:130px">Yüzde</th></tr></thead>
        <tbody id="filteredBody"></tbody>
      </table>
    </div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
